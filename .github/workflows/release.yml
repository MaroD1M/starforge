# 只做一件事：打 tag 时构建 Windows 绿色包并发布 Release。
# 平时零消耗（不打 tag 不跑），不产生失败记录，也不上传任何构建产物到仓库本身。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}        # 需要重跑时手动点一次；不需要可以删掉

permissions:
  contents: write              # 仅用于创建 Release

env:
  PYTHONIOENCODING: utf-8      # 防止 cp1252 控制台下打印非 ASCII 直接崩
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 取用 NMS-Shipwright（MIT）用于 vendor
        uses: actions/checkout@v4
        with:
          repository: S-T-0-7/NMS-Shipwright
          ref: f6bdc65f1c7b29acaf501046041a9ec795f14b85
          path: upstream-shipwright

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（可编辑安装，保证 --collect-submodules 能解析到包）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install .

      - name: 验证打包内含 tkinter（符文置顶窗口需要）
        shell: pwsh
        run: |
          python -c "import tkinter; print('tkinter available:', tkinter.TkVersion)"

      - name: 自检（不依赖游戏文件）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome
        run: |
          python -m starforge selftest
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::selftest 非 0（无游戏数据时属正常）" }

      - name: vendor 上游（只复制运行必需部分，约 0.5 MB）
        shell: pwsh
        run: python packaging/vendor.py --shipwright upstream-shipwright --dest build/vendor

      - name: 打包（onedir；入口 packaging/entry.py + vendor 的上游包）
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name starforge --onedir `
            --paths . --paths build/vendor `
            --collect-submodules nms_save --collect-submodules nms_procgen `
            --add-data "build/vendor/data;data" `
            --add-data "build/vendor/THIRD_PARTY_SHIPWRIGHT_LICENSE.txt;." `
            --collect-all hgpaktool --collect-all numpy --collect-all flask `
            --collect-all texture2ddecoder `
            --collect-submodules starforge --hidden-import tkinter `
            --add-data "starforge/web/static;starforge/web/static" `
            packaging/entry.py

      - name: 冒烟测试打包产物（抓漏依赖：v0.9.0-beta 曾漏掉 numpy）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome-pkg
        run: |
          $exe = "dist/starforge/starforge.exe"
          if (-not (Test-Path $exe)) { throw "没有找到 $exe" }
          & $exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "打包产物 --help 失败（exit $LASTEXITCODE）" }
          & $exe selftest | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "打包产物 selftest 失败（exit $LASTEXITCODE）" }
          # 关键依赖必须在包内
          foreach ($p in @("numpy", "flask", "_tkinter", "lz4", "hgpaktool", "texture2ddecoder", "nms_save", "mapping.json")) {
            $hit = Get-ChildItem -Recurse -Path "dist/starforge/_internal" -Filter "*$p*" -ErrorAction SilentlyContinue
            if (-not $hit) { throw "打包缺少依赖：$p" }
          }
          Write-Host "依赖检查通过"

      - name: 网页冒烟（起服务 → 请求首页与静态资源 → 关掉）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome-web
        run: |
          $exe = "dist/starforge/starforge.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","8899","--no-browser" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8899/" -UseBasicParsing -TimeoutSec 3; $ok = $true; break } catch {}
            }
            if (-not $ok) { throw "网页没起来（端口 8899）" }
            if ($r.StatusCode -ne 200) { throw "首页状态码 $($r.StatusCode)" }
            if ($r.Content -notmatch "tab-search") { throw "首页内容不对（可能没打到静态资源）" }
            $a = Invoke-WebRequest -Uri "http://127.0.0.1:8899/static/app.js" -UseBasicParsing -TimeoutSec 5
            if ($a.StatusCode -ne 200 -or $a.RawContentLength -lt 1000) { throw "静态资源 app.js 异常" }
            Write-Host "网页冒烟通过（首页 + app.js）"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path dist/starforge/* -DestinationPath "dist/starforge-${{ github.ref_name }}-win64.zip"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/starforge-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
          body: |
            自动构建产物（Windows x64，绿色解压即用）。

            - 依赖本地游戏目录与 NMS-Shipwright 数据层，首次启动请按引导选择路径
            - 默认只读；写入功能需在设置里显式开启
            - 非官方项目，请先备份存档
