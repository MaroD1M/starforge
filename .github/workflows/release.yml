# 只做一件事：打 tag 时构建 Windows 安装包并发布 Release。
# 平时零消耗（不打 tag 不跑），不产生失败记录，也不上传任何构建产物到仓库本身。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}        # 需要重跑时手动点一次；不需要可以删掉

permissions:
  contents: write              # 仅用于创建 Release

env:
  PYTHONIOENCODING: utf-8      # 防止 cp1252 控制台下打印非 ASCII 直接崩
  PYTHONUTF8: "1"
  # 默认裁掉 Qt 的软件 OpenGL（opengl32sw.dll，未压缩约 20 MB）。无 GPU/远程桌面下
  # 3D 预览会退回服务端 PNG；需要保留“安全模式”软件渲染时改成 "1"。
  STARFORGE_KEEP_SOFTWARE_OPENGL: "0"
  # 最终安装包的硬预算（MiB）。v0.16 目标 ≤70 MiB；用 Inno Setup LZMA2
  # solid 压缩，用户只下载这一个 exe，不需要任何额外依赖或组件。
  STARFORGE_SIZE_BUDGET_MIB: "70"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取用 NMS-Shipwright（MIT）用于 vendor
        uses: actions/checkout@v4
        with:
          repository: S-T-0-7/NMS-Shipwright
          ref: f6bdc65f1c7b29acaf501046041a9ec795f14b85
          path: upstream-shipwright

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（可编辑安装，保证 --collect-submodules 能解析到包）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest ruff
          pip install .

      - name: 发布前静态检查（pytest + ruff F 类）
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest 失败" }
          python -m ruff check --select F --config packaging/ruff.toml .
          if ($LASTEXITCODE -ne 0) { throw "ruff F 类检查失败" }

      - name: 自检（不依赖游戏文件）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome
        run: |
          python -m starforge selftest
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::selftest 非 0（无游戏数据时属正常）" }

      - name: vendor 上游（只复制运行必需部分，约 0.5 MB）
        shell: pwsh
        run: python packaging/vendor.py --shipwright upstream-shipwright --dest build/vendor

      # 分两步构建：先保留未裁剪的 runtime 记录基线，再单独裁剪并对比。
      # build_agent_runtime.py 用 NMSpy --no-deps + pymhf[http_api]，不会装 DearPyGUI。
      - name: 构建游戏内 agent 的独立 Python 运行时（先不裁剪）
        shell: pwsh
        run: python packaging/build_agent_runtime.py --no-prune

      - name: 体积报告（agent runtime 裁剪前）
        shell: pwsh
        run: |
          $before = Join-Path $env:RUNNER_TEMP "size-agent-before.json"
          python scripts/size_report.py build/agent-runtime --top 15 --by package --json |
            Set-Content -Encoding utf8 $before
          if ($LASTEXITCODE -ne 0) { throw "agent runtime 裁剪前体积报告失败" }

      - name: 裁剪 agent runtime（去掉 DearPyGUI/pywin32 开发件/字节码）并对比
        shell: pwsh
        run: |
          $before = Join-Path $env:RUNNER_TEMP "size-agent-before.json"
          python packaging/build_agent_runtime.py --prune-only
          if ($LASTEXITCODE -ne 0) { throw "agent runtime 裁剪或 import 自检失败" }
          python scripts/size_report.py build/agent-runtime --top 15 --by package --compare $before
          if ($LASTEXITCODE -ne 0) { throw "agent runtime 裁剪后体积报告失败" }

      - name: 打包（starforge-cli.exe：控制台 CLI + 原生 GUI；packaging/starforge.spec）
        shell: pwsh
        run: |
          # spec 内 name="starforge-cli"（等价于历史命令 --name starforge-cli）；
          # 历史命令：pyinstaller --noconfirm --clean --name starforge-cli --onedir ... packaging/entry.py
          python packaging/pyinstaller_build.py --noconfirm --clean packaging/starforge.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 失败（exit $LASTEXITCODE）" }
          if (-not (Test-Path "dist/starforge/starforge-cli.exe")) { throw "没有生成 starforge-cli.exe" }

      - name: 构建无控制台启动器（starforge.exe）
        shell: pwsh
        run: |
          # 历史命令：pyinstaller --noconfirm --clean --onefile --windowed --name starforge ...
          $icon = (Resolve-Path "assets/starforge.ico").Path
          python packaging/pyinstaller_build.py --noconfirm --clean --onefile --windowed --name starforge `
            --noupx --distpath "dist/launcher" --workpath "build/launcher" `
            --specpath "build/launcher" --icon $icon `
            packaging/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "无控制台启动器构建失败（exit $LASTEXITCODE）" }
          Copy-Item "dist/launcher/starforge.exe" "dist/starforge/starforge.exe"
          if (-not (Test-Path "dist/starforge/starforge.exe")) { throw "没有生成无控制台启动器" }
          if (-not (Test-Path "dist/starforge/starforge-cli.exe")) { throw "没有生成 CLI 可执行文件" }
          Write-Host "启动器已生成：dist/starforge/starforge.exe → starforge-cli.exe"

      - name: 体积报告（_internal 裁剪前基线）
        shell: pwsh
        run: |
          $before = Join-Path $env:RUNNER_TEMP "size-internal-before.json"
          python scripts/size_report.py dist/starforge/_internal --top 25 --by package --json |
            Set-Content -Encoding utf8 $before
          if ($LASTEXITCODE -ne 0) { throw "裁剪前体积报告失败" }

      - name: 裁剪包内安全冗余（Qt 翻译/插件、unicorn 静态库、numpy 测试）
        shell: pwsh
        run: |
          $pruneArgs = @("packaging/prune_bundle.py", "dist/starforge/_internal")
          if ($env:STARFORGE_KEEP_SOFTWARE_OPENGL -eq "1") { $pruneArgs += "--keep-software-opengl" }
          python @pruneArgs
          if ($LASTEXITCODE -ne 0) { throw "裁剪 _internal 失败" }

      - name: 体积报告（裁剪后的 _internal，对比裁剪前）
        shell: pwsh
        run: |
          $before = Join-Path $env:RUNNER_TEMP "size-internal-before.json"
          python scripts/size_report.py dist/starforge/_internal --top 25 --by package --compare $before
          if ($LASTEXITCODE -ne 0) { throw "裁剪后体积报告失败" }

      - name: 冒烟测试打包产物（抓漏依赖：v0.9.0-beta 曾漏掉 numpy）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome-pkg
        run: |
          $exe = "dist/starforge/starforge-cli.exe"
          if (-not (Test-Path $exe)) { throw "没有找到 $exe" }
          $help = & $exe --help 2>&1 | Out-String
          $help | Out-Host
          if ($help -notmatch "app") { throw "打包产物的帮助里没有 app 命令" }
          if ($LASTEXITCODE -ne 0) { throw "打包产物 --help 失败（exit $LASTEXITCODE）" }
          & $exe selftest | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "打包产物 selftest 失败（exit $LASTEXITCODE）" }
          # 关键依赖必须在包内
          foreach ($bundle in @("dist/starforge/_internal")) {
            # 这里只查"必须在磁盘上有文件"的二进制/数据依赖；纯 Python 包（capstone/pefile）
            # 会进 PYZ，磁盘上找不到属正常 —— 它们由下一步 doctor 用 import 验证。
            foreach ($p in @("numpy", "flask", "werkzeug", "lz4", "hgpaktool",
                             "texture2ddecoder", "mapping.json")) {
              $hit = Get-ChildItem -Recurse -Path $bundle -Filter "*$p*" -ErrorAction SilentlyContinue
              if (-not $hit) { throw "打包缺少依赖：$p（$bundle）" }
            }
          }
          # 纯 Python 的上游包会进 PYZ（磁盘上没有目录），所以用"跑一次 selftest"来验证
          $out = & $exe selftest 2>&1 | Out-String
          $out | Out-Host
          if ($out -match "Shipwright: 未找到") { throw "打包产物里没有内置上游（nms_save 不可导入）" }
          if ($out -notmatch "内置\(打包版\)") { throw "内置上游未被识别为打包版：$out" }
          Write-Host "依赖检查通过（含内置上游）"

      - name: 运行时体检（doctor：unicorn/依赖/窗口/上游）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome-doctor
        run: |
          $exe = "dist/starforge/starforge-cli.exe"
          $out = & $exe doctor 2>&1 | Out-String
          $out | Out-Host
          # doctor 的退出码含"桌面窗口可用"这一项，CI 环境不保证，所以只断言关键依赖
          if ($out -match '"unicorn":\s*\{\s*"ok": false') { throw "打包产物里 unicorn 不可用（星系/行星生成会失效）" }
          foreach ($dep in @("numpy", "flask", "lz4", "hgpaktool", "texture2ddecoder", "pefile")) {
            if ($out -notmatch ('"' + $dep + '": "ok"')) { throw "依赖不可用：$dep" }
          }
          Write-Host "doctor 检查通过"

      - name: 原生 Qt 依赖自检
        shell: pwsh
        run: |
          foreach ($p in @("PySide6", "Qt6Core.dll", "Qt6Widgets.dll", "Qt6OpenGLWidgets.dll")) {
            $hit = Get-ChildItem -Recurse -Path "dist/starforge/_internal" -Filter "*$p*" -ErrorAction SilentlyContinue
            if (-not $hit) { throw "打包缺少原生 Qt 依赖：$p" }
          }
          Write-Host "原生 Qt 依赖检查通过"

      - name: API 冒烟（进程内自检，不依赖端口）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome-web
        run: |
          $exe = "dist/starforge/starforge-cli.exe"
          & $exe webcheck
          if ($LASTEXITCODE -ne 0) { throw "接口自检失败（exit $LASTEXITCODE）" }

      - name: 起服务冒烟（失败时打印子进程日志）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome-serve
        run: |
          $exe = "dist/starforge/starforge-cli.exe"
          $out = Join-Path $env:RUNNER_TEMP "serve.out.log"
          $err = Join-Path $env:RUNNER_TEMP "serve.err.log"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","8899","--no-browser" `
                -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8899/api/health" -UseBasicParsing -TimeoutSec 3; $ok = $true; break } catch {}
            }
            if (-not $ok) {
              Write-Host "----- serve stdout -----"; if (Test-Path $out) { Get-Content $out | Out-Host }
              Write-Host "----- serve stderr -----"; if (Test-Path $err) { Get-Content $err | Out-Host }
              throw "服务没起来（端口 8899）"
            }
            $r2 = Invoke-WebRequest -Uri "http://127.0.0.1:8899/" -UseBasicParsing -TimeoutSec 5
            if ($r2.Content -notmatch 'starforge-api') { throw "根路径不是 API-only JSON" }
            Write-Host "API 服务冒烟通过"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 组装发布目录（GUI + CLI + agent 运行时）
        shell: pwsh
        run: |
          if (-not (Test-Path "build/agent-runtime/python.exe")) {
            throw "缺少 build/agent-runtime（agent 运行时必须内置，不能让用户额外下载）"
          }
          if (Test-Path "dist/starforge/agent-runtime") {
            Remove-Item -Recurse -Force "dist/starforge/agent-runtime"
          }
          Copy-Item -Recurse -Force "build/agent-runtime" "dist/starforge/agent-runtime"
          Set-Content -Path "dist/starforge/starforge-safe.bat" -Encoding ascii -Value '@echo off','"%~dp0starforge.exe" app --safe','pause'

      - name: 构建 Inno Setup 安装包（LZMA2 solid）
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "未找到 Inno Setup，尝试用 Chocolatey 安装（仅 CI 工具，不进入发布包）"
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "找不到 ISCC.exe（Inno Setup 6）" }

          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -match '^(\d+\.\d+\.\d+)') {
            $version = $Matches[1]
          } else {
            $version = (python -c "import starforge; print(starforge.__version__)").Trim()
          }
          Write-Host "Inno Setup 版本：$version"
          & $iscc "/DAppVersion=$version" "installer/starforge.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败（exit $LASTEXITCODE）" }
          $setup = Get-ChildItem "dist/starforge-*-win64-setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "没有生成安装包" }
          Write-Host "安装包：$($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MiB)"

      - name: 体积报告与预算（最终安装包 + 解压体积构成）
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist/starforge-*-win64-setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python scripts/size_report.py $setup.FullName --fail-over $env:STARFORGE_SIZE_BUDGET_MIB
          if ($LASTEXITCODE -ne 0) { throw "安装包超过预算 $env:STARFORGE_SIZE_BUDGET_MIB MiB" }
          python scripts/size_report.py dist/starforge --top 20 --by category

      - name: 安装包冒烟（静默安装到干净目录 + doctor/webcheck）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome-installed
        run: |
          $setup = Get-ChildItem "dist/starforge-*-win64-setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "sf-installed"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          $p = Start-Process -FilePath $setup.FullName `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$dir`"" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装失败（exit $($p.ExitCode)）" }
          $exe = Join-Path $dir "starforge-cli.exe"
          if (-not (Test-Path $exe)) { throw "安装目录缺少 starforge-cli.exe" }
          if (-not (Test-Path (Join-Path $dir "agent-runtime/python.exe"))) {
            throw "安装目录缺少内置 agent 运行时"
          }
          $out = & $exe doctor 2>&1 | Out-String
          $out | Out-Host
          if ($out -match '"unicorn":\s*\{\s*"ok": false') { throw "安装后的 unicorn 不可用" }
          foreach ($dep in @("numpy", "flask", "lz4", "hgpaktool", "texture2ddecoder", "pefile")) {
            if ($out -notmatch ('"' + $dep + '": "ok"')) { throw "安装后依赖不可用：$dep" }
          }
          & $exe webcheck
          if ($LASTEXITCODE -ne 0) { throw "安装后 webcheck 失败（exit $LASTEXITCODE）" }
          Write-Host "安装包冒烟通过（零额外下载）"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/starforge-*-win64-setup.exe
          generate_release_notes: true
          body: |
            自动构建产物（Windows x64，安装即用，不需要额外下载任何依赖或组件）。

            - 已内置 PySide6、numpy、unicorn、NMS-Shipwright 数据层和 agent 的独立 Python 运行时
            - 依赖本地游戏目录；首次启动请按引导选择路径
            - 默认只读；写入功能需在设置里显式开启
            - 非官方项目，请先备份存档
