# 只做一件事：打 tag 时构建 Windows 绿色包并发布 Release。
# 平时零消耗（不打 tag 不跑），不产生失败记录，也不上传任何构建产物到仓库本身。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}        # 需要重跑时手动点一次；不需要可以删掉

permissions:
  contents: write              # 仅用于创建 Release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 验证打包内含 tkinter（符文置顶窗口需要）
        shell: pwsh
        run: |
          python -c "import tkinter; print('tkinter available:', tkinter.TkVersion)"

      - name: 自检（不依赖游戏文件）
        shell: pwsh
        env:
          STARFORGE_HOME: ${{ runner.temp }}/sfhome
        run: |
          python -m starforge selftest
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::selftest 非 0（无游戏数据时属正常）" }

      - name: 打包（onedir，不做单文件：启动快、杀软误报少）
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name starforge --onedir `
            --collect-all hgpaktool --collect-submodules starforge `
            --hidden-import tkinter `
            starforge/__main__.py

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path dist/starforge/* -DestinationPath "dist/starforge-${{ github.ref_name }}-win64.zip"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/starforge-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
          body: |
            自动构建产物（Windows x64，绿色解压即用）。

            - 依赖本地游戏目录与 NMS-Shipwright 数据层，首次启动请按引导选择路径
            - 默认只读；写入功能需在设置里显式开启
            - 非官方项目，请先备份存档
