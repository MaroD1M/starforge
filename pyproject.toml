[project]
name = "starforge"
version = "0.9.7"
description = "无人深空飞船/星球搜寻与预览（本地网页 + Python 内核）"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "numpy>=1.24", "lz4>=4.0", "psutil>=5.9"]

[project.optional-dependencies]
search = ["unicorn>=2.0"]        # 只有 systemgen / 星球扇扫需要
dev = ["pytest>=8.0"]

[project.scripts]
starforge = "starforge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["starforge", "starforge.core", "starforge.data", "starforge.save", "starforge.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
