[project]
name = "starforge"
version = "0.14.0"
description = "无人深空飞船/星球搜寻与预览（本地网页 + Python 内核）"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "numpy>=1.24", "lz4>=4.0", "psutil>=5.9"]

[project.optional-dependencies]
search = ["unicorn>=2.0"]        # 只有 systemgen / 星球扇扫需要
dev = ["pytest>=8.0"]
agent = ["NMSpy==185034.0; platform_system == 'Windows'", "pymhf[http_api]>=0.2.5; platform_system == 'Windows'"]

[project.scripts]
starforge = "starforge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["starforge", "starforge.core", "starforge.data", "starforge.save", "starforge.web", "starforge.live", "starforge.services", "starforge.app", "starforge.app.pages", "starforge.app.widgets", "starforge.agent"]

[tool.setuptools.package-data]
"starforge.live" = ["builds/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
