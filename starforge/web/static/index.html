<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>starforge · 无人深空飞船与星球情报台</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">starforge</div>
  <nav class="tabs">
    <button data-tab="search" class="on">搜飞船</button>
    <button data-tab="mine">我的船</button>
    <button data-tab="systems">星球</button>
    <button data-tab="settings">设置</button>
  </nav>
  <div class="right">
    <span id="lvBadge" class="pill">…</span>
    <span id="jobbar" class="jobbar hide"></span>
    <span id="ver" class="muted"></span>
  </div>
</header>

<main>
  <!-- ============ 搜索 ============ -->
  <section id="tab-search" class="tab on">
    <aside class="side">
      <label>船型
        <select id="shipSel"></select>
      </label>
      <div class="hint" id="shipHint"></div>
      <div class="block">
        <div class="blockhead">部件 <span class="muted" id="partCount"></span></div>
        <div class="toggles">
          <button id="modeWant" class="mini on">想要</button>
          <button id="modeAvoid" class="mini">不要</button>
          <input id="partFilter" class="filter" placeholder="过滤部件名…">
        </div>
        <div id="partTree" class="tree"></div>
      </div>
      <label>数量 <input id="limit" type="number" value="12" min="1" max="60"></label>
      <label>最多搜索 <select id="maxSeeds">
          <option value="20000000">2000 万种子（约 1–2 秒）</option>
          <option value="200000000" selected>2 亿种子（约 10–15 秒）</option>
          <option value="2000000000">20 亿种子（约 2–3 分钟）</option>
        </select></label>
      <button id="goSearch" class="primary">开始搜索</button>
      <div id="searchMsg" class="msg"></div>
    </aside>
    <div class="content">
      <div class="gridbar">
        <span id="resultInfo" class="muted">还没有结果</span>
        <span class="grow"></span>
        <span id="etaInfo" class="muted"></span>
      </div>
      <div id="grid" class="grid"></div>
    </div>
    <aside class="detail" id="searchDetail">
      <div class="empty">选一个结果看 3D</div>
    </aside>
  </section>

  <!-- ============ 我的船 ============ -->
  <section id="tab-mine" class="tab">
    <aside class="side">
      <label>存档 <input id="savePath" placeholder="自动发现"></label>
      <button id="openSave" class="primary">打开存档</button>
      <button id="pickDefault" class="mini">用默认存档</button>
      <div id="saveMsg" class="msg"></div>
      <div id="shipList" class="list"></div>
    </aside>
    <div class="content"><div class="empty">选左边的船看 3D 与部件</div></div>
    <aside class="detail" id="mineDetail"><div class="empty">—</div></aside>
  </section>

  <!-- ============ 星球 ============ -->
  <section id="tab-systems" class="tab">
    <aside class="side">
      <label>圆心
        <select id="centerMode">
          <option value="current" selected>存档当前位置</option>
          <option value="glyphs">手动输入 glyph / 坐标</option>
        </select>
      </label>
      <input id="centerInput" class="hide" placeholder="如 1043FEE69929 或 0128:007D:0668:0043">
      <label>范围 <select id="radius">
          <option value="0" selected>本 region</option>
          <option value="1">+ 邻接 region（27 个）</option>
        </select></label>
      <label>每区系统数 <input id="sysCount" type="number" value="200" min="20" max="767"></label>
      <label>生物群系 <select id="biomeSel"><option value="">不限</option></select></label>
      <label>哨兵 <select id="sentSel">
          <option value="">不限</option><option>none</option><option>low</option>
          <option>high</option><option>aggressive</option><option>corrupted</option>
        </select></label>
      <label class="check"><input id="dissChk" type="checkbox"> 只要 dissonant（能刷拦截机）</label>
      <label>上限 <input id="sysLimit" type="number" value="30" min="1" max="200"></label>
      <button id="goScan" class="primary">扫描</button>
      <button id="curSystem" class="mini">看当前星系</button>
      <div id="sysMsg" class="msg"></div>
    </aside>
    <div class="content">
      <div id="sysInfo" class="sysinfo"></div>
      <table id="sysTable" class="table hide">
        <thead><tr><th>#</th><th>行星</th><th>生物群系</th><th>哨兵</th><th>地址</th><th>glyphs</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <aside class="detail" id="sysDetail"><div class="empty">星系信息与船池会显示在这里</div></aside>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="tab-settings" class="tab">
    <aside class="side">
      <label>游戏目录 <input id="gameDir" placeholder="含 Binaries/NMS.exe"></label>
      <label>存档目录 <input id="savesDir" placeholder="含 save.hg"></label>
      <label>数据目录 <input id="gameData" placeholder="Gagarin/GAMEDATA"></label>
      <button id="saveSettings" class="primary">保存</button>
      <label class="check"><input id="writeChk" type="checkbox"> 允许写入（默认关闭；开启后仍需每次确认）</label>
      <div id="setMsg" class="msg"></div>
      <div class="blockhead" style="margin-top:14px">实时通道（可选）</div>
      <div id="liveStatus" class="hint">检查中…</div>
      <button id="genMod" class="mini">生成模板 Mod</button>
      <button id="probeLive" class="mini">探测模板槽（只读）</button>
      <div class="hint">生成后把 <code>starforge-templates</code> 复制到 <code>GAMEDATA/MODS/</code>，重启游戏生效。</div>
    </aside>
    <div class="content">
      <div class="blockhead">诊断</div>
      <button id="runDiag" class="mini">运行自检</button>
      <pre id="diagOut" class="diag"></pre>
    </div>
    <aside class="detail"><div class="empty">starforge 只监听本机；不联网；写入前自动备份。</div></aside>
  </section>
</main>

<!-- 3D 查看器 -->
<div id="viewerWrap" class="viewer hide">
  <canvas id="viewerCanvas"></canvas>
  <div class="viewerbar">
    <span id="viewerInfo" class="muted"></span>
    <span class="grow"></span>
    <button id="vIso" class="mini on">等轴</button>
    <button id="vTop" class="mini">俯视</button>
    <button id="vSide" class="mini">侧视</button>
    <button id="vSpin" class="mini">自动旋转</button>
    <a id="vGlb" class="mini" href="#" download>下载 glb</a>
  </div>
</div>

<!-- 符文浮窗（网页版，独立窗口时用于 Ctrl+Shift+G） -->
<div id="glyphModal" class="modal hide">
  <div class="modalbox">
    <div class="modalhead"><b>传送门符文</b><span class="grow"></span><button class="mini" id="glyphClose">关闭</button></div>
    <img id="glyphImg" alt="12 个传送门符文">
    <div class="glyphrow">
      <code id="glyphDigits"></code>
      <button class="mini" id="glyphCopy">复制符文</button>
      <button class="mini" id="glyphPop">弹出为置顶窗口</button>
    </div>
    <div id="glyphTarget" class="muted"></div>
  </div>
</div>

<script src="/static/viewer.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
